baseURL: https://redou12.github.io/

languageCode: zh-cn
title: "Redou的博客"
theme: PaperMod
timeZone: Asia/Shanghai

# Hugo 功能
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true

# 图片缓存
caches:
  images:
    dir: :cacheDir/images

# 分页
pagination:
  pagerSize: 5

# 分类 / 标签 / 系列
taxonomies:
  category: categories
  tag: tags
  series: series

# 搜索需要 JSON
outputs:
  home:
    - HTML
    - RSS
    - JSON

# =========================
# PaperMod
# =========================

params:

  # 主题模式
  defaultTheme: auto
  disableThemeToggle: false

  # 网站描述
  description: "记录游戏开发、像素画、AI与独立游戏"
  author: "Redou"

  # 文章功能
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowToc: true

  # 目录默认关闭
  TocOpen: false

  # 首页
  homeInfoParams:
    Title: "👋 Hi，我是 Redou"
    Content: |
      在此我会记录游戏开发、像素画、AI、独立游戏与生活思考。

  # GitHub
  socialIcons:
    - name: github
      url: "https://github.com/redou12"

  # 文章封面
  cover:
    responsiveImages: true
    linkFullImages: true

# =========================
# 顶部导航
# =========================

menu:
  main:

    - name: 文章
      url: /posts/
      weight: 10

    - name: 游戏开发
      url: /gamedev/
      weight: 20

    - name: 像素画记录
      url: /pixelart/
      weight: 30

    - name: 杂谈分享
      url: /talk/
      weight: 40

    - name: 友链
      url: /friends/
      weight: 50

    - name: 归档
      url: /archives/
      weight: 60

    - name: 关于我
      url: /about/
      weight: 70